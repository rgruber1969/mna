# Serviços locais de desenvolvimento (ADR-0003).
# Subir:  docker compose up -d      Parar: docker compose down
# Apagar os dados locais: docker compose down -v
name: mna

services:
  db:
    # Manter na mesma versão major do Postgres usado no Neon.
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mna}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mna_dev}
      POSTGRES_DB: ${POSTGRES_DB:-mna}
    ports:
      # Apenas localhost: o banco não fica exposto na rede.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Arquivos do desenvolvimento (ADR-0012): armazenamento compatível com S3.
  # Console: http://localhost:9001 · API S3: http://localhost:9000
  arquivos:
    image: rustfs/rustfs:1.0.6
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:-mna_dev}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:-mna_dev_segredo}
      RUSTFS_CONSOLE_ENABLE: "true"
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
      - "127.0.0.1:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - arquivos-data:/data

  # E-mails do desenvolvimento (ADR-0014): captura tudo, nada é entregue.
  # Caixa de entrada: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.34.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"

  # Tarefas em segundo plano (ADR-0015): servidor local do Inngest.
  # Painel: http://localhost:8288 · chama a aplicação em /api/inngest.
  inngest:
    image: inngest/inngest:v1.53.0
    restart: unless-stopped
    command: inngest dev -u http://host.docker.internal:${APP_PORT:-3000}/api/inngest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${INNGEST_PORT:-8288}:8288"

volumes:
  db-data:
  arquivos-data:
